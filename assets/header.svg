<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 220" role="img" aria-labelledby="title desc">
  <title id="title">Mateus Matyak  Full-Stack Developer</title>
  <desc id="desc">Secure, event-driven microservice ecosystems. Vue.js on the front, Spring Boot BFF, Keycloak, RabbitMQ and Vault.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1c"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="888" height="220" rx="16" fill="url(#bg)"/>
  <ellipse cx="720" cy="-10" rx="260" ry="140" fill="url(#glow)"/>
  <rect x="1" y="1" width="886" height="218" rx="15" fill="none" stroke="#253247"/>

  <g transform="translate(36 48)" fill="none" stroke-width="7.2" stroke-linejoin="miter" stroke-miterlimit="2.2" stroke-linecap="butt">
    <g transform="scale(0.72)">
      <path d="M11 51V7L33 48" stroke="#e6ebf3"/>
      <path d="M31 48L53 7V51" stroke="#818cf8"/>
    </g>
  </g>

  <text x="92" y="68" fill="#e6ebf3" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="0.04em">Mateus Matyak</text>
  <text x="92" y="98" fill="#818cf8" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="600" letter-spacing="0.18em">FULL-STACK DEVELOPER</text>
  <text x="92" y="126" fill="#a3b0c4" font-family="'Segoe UI', system-ui, sans-serif" font-size="14">I design and build secure, event-driven microservice ecosystems.</text>

  <rect x="36" y="154" width="816" height="1" fill="url(#line)"/>

  <g font-family="ui-monospace, 'Cascadia Code', 'Segoe UI', monospace" font-size="12" font-weight="600">
    <text x="44" y="186" fill="#818cf8">SPA</text>
    <text x="78" y="186" fill="#6b7a94">’</text>
    <text x="100" y="186" fill="#e6ebf3">Gateway</text>
    <text x="168" y="186" fill="#6b7a94">’</text>
    <text x="190" y="186" fill="#e6ebf3">BFF</text>
    <text x="220" y="186" fill="#6b7a94">’</text>
    <text x="242" y="186" fill="#e6ebf3">RabbitMQ</text>
    <text x="314" y="186" fill="#6b7a94">’</text>
    <text x="336" y="186" fill="#e6ebf3">Workers</text>
    <text x="398" y="186" fill="#6b7a94">’</text>
    <text x="420" y="186" fill="#e6ebf3">PostgreSQL</text>
    <text x="720" y="186" fill="#6b7a94">Curitiba, Brazil</text>
  </g>
